<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body{
            background-color: rgb(105, 105, 173);
            color: white; /* Comentario Css */
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1{
            color: rgb(255, 239, 15);
            
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Me livrei da maldição!</p>
    <script>
        var nome = window.prompt('Qual é o seu nome?') // vai perguntar o nome
        window.alert("É um grande prazer," + nome + "!") // concatenação ( O sinal de + junta o recado e a variavel)
    </script>
</body>
</html>
